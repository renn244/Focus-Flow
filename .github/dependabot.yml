# Dependabot: one bundled update per app each week, instead of one PR per package.
# Minor and patch updates are grouped together; major versions (which can break
# things) still arrive separately so they get a proper look.
# Security fixes are always opened right away, whatever the schedule.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["backend", "dependencies"]
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["frontend", "dependencies"]
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["github-actions", "dependencies"]
    groups:
      actions:
        patterns: ["*"]
