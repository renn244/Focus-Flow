name: "Bug Report"
description: "Report a bug or issue to help us improve FocusFlow."
labels: ["bug"]
body: 
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Please fill out the following details to help us understand and resolve the issue.

        Before submitting, please check if you've done the following:
  - type: checkboxes
    id: preconditions
    attributes:
      label: "Preconditions"
      options:
        - label: Checked the [documentation](https://docs.focusflow.app) for guidance.
        - label: Searched for existing issues to avoid duplicates.
        - label: Provided clear and concise information about the bug.
        - label: tried to understand the issue or fix it.
  - type: input
    id: title
    attributes:
      label: "Issue Title"
      placeholder: "E.g, 'App crashes on startup'"
      description: "A brief summary of the issue you're experiencing."
    validation:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "E.g, 'The app crashes when I try to open it.'"
      description: "Describe the issue in detail, including steps to reproduce, expected behavior, and actual behavior."
    validation:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "Select the environment where you encountered the issue."
      options:
        - "Development"
        - "Staging"
        - "Production"
      default: "Development"
    validation:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. `npm i`
        2. `npm start:dev`
        3. See error...
      description: "List the steps to reproduce the issue."
    validation:
      required: true
  - type: textarea
    id: other_things
    attributes:
      label: "Other"
      description: |
        Anything else relevant? eg: Logs, OS version, IDE, package manager, etc.
        **Tip:** You can attach images, recordings or log files by clicking this area to highlight it and then dragging files in